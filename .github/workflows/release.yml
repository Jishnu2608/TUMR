name: Release build

# Manual only (task DIST-001). Builds a release on a fresh GitHub-hosted Windows VM with scripts/release.ps1 and
# keeps the result as a workflow artifact: per-user NSIS installer, portable ZIP, CLI ZIP,
# SHA256SUMS and releases.json (download URLs point at this repository's GitHub Releases, W5).
# REL-008: after the build and the checks it creates a DRAFT GitHub release v<version> with all
# files and the notes from CHANGELOG.md. Drafts are not public: the owner reviews it and presses
# Publish; publishing then sends server.json to the MCP Registry (mcp-registry.yml). Nothing is
# signed yet (W8).
# It also installs the new installer silently, runs the installed tumr, and uninstalls it again,
# so every release build is checked on a clean machine.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel written into releases.json"
        type: choice
        options: [stable, beta]
        default: stable
      draft_release:
        description: "Create the draft GitHub release (off: only build and keep the files)"
        type: boolean
        default: true
      prerelease:
        description: "Mark the draft as a pre-release (tests; never listed as latest, not sent to the MCP Registry)"
        type: boolean
        default: false

permissions:
  # contents: write creates the draft release (and its tag when it is published)
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build, check and keep the release files
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # stop before the long build when the release cannot be drafted anyway
      - name: Check the version, its tag and its release notes
        if: ${{ inputs.draft_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?m)^\[workspace\.package\][\s\S]*?^version\s*=\s*"([^"]+)"') { throw "no version in Cargo.toml" }
          $version = $Matches[1]
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "release $tag exists already: raise the version in Cargo.toml first" }
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) { throw "tag $tag exists already: raise the version in Cargo.toml first" }
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($version))\s*\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success -or -not $m.Groups[1].Value.Trim()) { throw "CHANGELOG.md has no '## $version' section: add the release notes first" }
          $footer = @(
            '',
            '---',
            '**Files:** the installer (per user, no administrator rights) is the recommended download; the portable ZIP and the command-line ZIP need no install. `tumr-mcp_*.mcpb` is the MCP bundle for Claude Desktop, `tumr-vscode-*.vsix` the VS Code extension (also on the VS Code Marketplace and Open VSX). Checksums: `SHA256SUMS`.',
            '',
            'Windows 11 x64. Not code-signed yet: Windows SmartScreen warns on first start (More info > Run anyway).'
          ) -join "`n"
          $notes = $m.Groups[1].Value.Trim() + "`n" + $footer
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          "RELEASE_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "release ${tag}: notes ready ($($notes.Length) characters)"
          # git ls-remote returns 2 when the tag is missing (the good case); the step must not fail on it
          $global:LASTEXITCODE = 0

      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/ui/package-lock.json
            apps/vscode/package-lock.json

      # the third-party notices read the desktop UI's node_modules, so install them first
      - name: Desktop UI dependencies
        run: npm --prefix apps/desktop/ui ci --no-audit --no-fund

      - name: Build the release (scripts/release.ps1, unsigned)
        shell: pwsh
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 -BaseUrl $base -Channel ${{ inputs.channel }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check checksums and the manifest
        shell: pwsh
        run: |
          $dir = Get-ChildItem dist -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "RELEASE_DIR=$($dir.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-Content (Join-Path $dir.FullName "SHA256SUMS") | ForEach-Object {
            $hash, $name = $_ -split '\s+', 2
            $actual = (Get-FileHash (Join-Path $dir.FullName $name) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $hash) { throw "checksum mismatch: $name" }
            "ok  $name"
          }
          $m = Get-Content (Join-Path $dir.FullName "releases.json") -Raw | ConvertFrom-Json
          $r = $m.releases[0]
          "version $($r.version), channel $($r.channel), signed $($r.signed), $($r.files.Count) files"
          $r.files | ForEach-Object { "  $($_.kind): $($_.url)" }

      - name: Install, run and uninstall on this clean machine
        shell: pwsh
        run: |
          $setup = Get-ChildItem $env:RELEASE_DIR -Filter "*-setup.exe" | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $tumr = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter tumr.exe -Depth 3 -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'cargo|target' } | Select-Object -First 1
          if (-not $tumr) { throw "tumr.exe not found after the install" }
          "installed: $($tumr.FullName)"
          & $tumr.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "installed tumr --version failed" }
          & $tumr.FullName agent clients
          $uninst = Get-ChildItem $tumr.DirectoryName -Filter "uninstall*.exe" | Select-Object -First 1
          if ($uninst) {
            $u = Start-Process $uninst.FullName -ArgumentList "/S" -Wait -PassThru
            "uninstaller exit code $($u.ExitCode)"
          }

      - name: Keep the release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.channel }}-${{ github.sha }}
          path: |
            ${{ env.RELEASE_DIR }}/*.exe
            ${{ env.RELEASE_DIR }}/*.zip
            ${{ env.RELEASE_DIR }}/*.mcpb
            ${{ env.RELEASE_DIR }}/*.vsix
            ${{ env.RELEASE_DIR }}/server.json
            ${{ env.RELEASE_DIR }}/SHA256SUMS
            ${{ env.RELEASE_DIR }}/releases.json
          retention-days: 14
          if-no-files-found: error

      - name: Create the draft GitHub release
        if: ${{ inputs.draft_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem $env:RELEASE_DIR -File |
            Where-Object { $_.Extension -in '.exe', '.zip', '.mcpb', '.vsix' -or $_.Name -in 'server.json', 'SHA256SUMS', 'releases.json' }
          if ($files.Count -lt 8) { throw "expected 8 release files, found $($files.Count): $($files.Name -join ', ')" }
          $man = Get-Content (Join-Path $env:RELEASE_DIR "releases.json") -Raw | ConvertFrom-Json
          if ($man.releases[0].version -ne $env:RELEASE_VERSION) { throw "built $($man.releases[0].version), expected $env:RELEASE_VERSION" }
          $ghArgs = @("release", "create", "v$env:RELEASE_VERSION", "--repo", $env:GITHUB_REPOSITORY, "--draft",
            "--target", $env:GITHUB_SHA, "--title", "Toolchain Universal Mobile Runtime $env:RELEASE_VERSION",
            "--notes-file", "release-notes.md")
          if ("${{ inputs.prerelease }}" -eq "true") { $ghArgs += "--prerelease" } else { $ghArgs += "--latest" }
          $ghArgs += $files.FullName
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "creating the draft release failed" }
          "Draft release v$env:RELEASE_VERSION created with $($files.Count) files. Review it on GitHub (Releases) and press Publish."
          "### Draft release v$env:RELEASE_VERSION ready" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "Review it under **Releases** and press **Publish release**. Publishing sends server.json to the MCP Registry." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
